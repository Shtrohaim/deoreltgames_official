name: Deploy to VPS

# Runs only after the VPS is set up (see deploy/README.md):
#   repository variable VPS_DOMAIN  – e.g. deoreltgames.ru
#   repository secrets  VPS_HOST    – server IP or hostname
#                       VPS_SSH_KEY – private key whose public half is in
#                                     /home/deploy/.ssh/authorized_keys
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.VPS_DOMAIN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build for the domain
        run: npm run build
        env:
          SITE_URL: https://${{ vars.VPS_DOMAIN }}
          BASE_PATH: /

      - name: Upload with rsync
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          rsync -az --delete dist/ "deploy@$HOST:/var/www/deoreltgames/"
